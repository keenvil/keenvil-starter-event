name: Publish to GitHub Packages

on:
  push:
    branches: [ development ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>cork</id>
                <username>${env.MAVEN_CI_USERNAME}</username>
                <password>${env.MAVEN_PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>event</id>
                <username>${env.MAVEN_CI_USERNAME}</username>
                <password>${env.MAVEN_PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          MAVEN_CI_USERNAME: ci-packages
          MAVEN_PACKAGES_TOKEN: ${{ secrets.MAVEN_PACKAGES_TOKEN }}

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy -DskipTests -Dcheckstyle.skip=true
        env:
          MAVEN_CI_USERNAME: ci-packages
          MAVEN_PACKAGES_TOKEN: ${{ secrets.MAVEN_PACKAGES_TOKEN }}
